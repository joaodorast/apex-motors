    <meta charset="UTF-8" />

    <meta name="theme-color" content="#070809" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Pré-carrega a imagem do hero apenas quando a entrada é a Home.
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.type = 'image/avif';
        l.setAttribute('imagesrcset', '/img/apex-one-hero-480.avif 480w, /img/apex-one-hero-768.avif 768w, /img/apex-one-hero-1080.avif 1080w, /img/apex-one-hero-1376.avif 1376w');
        l.setAttribute('imagesizes', '100vw');
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family:system-ui;color:#F4F5F6;background:#070809;padding:2rem">A experiência APEX MOTORS requer JavaScript habilitado.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
